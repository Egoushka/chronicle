[project]
name = "chronicle"
version = "0.7.2"
description = "Personal event store and retrieval brain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pymysql>=1.1",   # firefly is MariaDB (fact 3); doctor vendors its own copy, so it hid this
    "pgvector>=0.3.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=2.2,<3",   # majors break the server API (2.0 removed fastmcp); see Dockerfile.mcp
    "pydantic>=2.13.5",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk>=2.4",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3.3",
    "onnxruntime>=1.20",   # the api's query encoder, EMBED_BACKEND=onnx; docs/ADR-003
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
