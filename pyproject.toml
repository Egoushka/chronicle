[project]
name = "chronicle"
version = "0.1.0"
description = "Personal event store and retrieval brain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.9",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk>=2.4",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
