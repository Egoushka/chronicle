name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install pytest numpy ruff
      # bash -n: a quote inside ${VAR:?message} once broke two scripts silently.
      - run: for f in scripts/*.sh .githooks/*; do bash -n "$f"; done
      - run: PYTHONPATH=. python -m pytest tests/ -q
      - run: ruff check chronicle/ tests/ || true

  migrations:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    services:
      # pgvector >= 0.7 required: halfvec does not exist in 0.6.
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # scripts/*-itest.py, run by smoke.sh. numpy: worker-itest imports segment.py.
      - run: pip install 'psycopg[binary]' httpx numpy
      - name: apply migrations and smoke-test every function
        env: { PGPASSWORD: postgres, PGHOST: localhost, PGUSER: postgres }
        run: ./scripts/smoke.sh

  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    # On pull requests gitleaks-action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prints short hashes only: echoing the offending address would publish it in the log.
      - name: Every commit uses a GitHub noreply address
        run: |
          bad=$(git log --format='%h %ae%n%h %ce' \
            | grep -vE ' ([^ @]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "Commits with an address that is not a GitHub noreply one:"
            echo "$bad" | cut -d' ' -f1 | sort -u
            exit 1
          fi

  # An owner PR is gated by the `fast-tier` status `ws ship` posts; a Dependabot PR
  # runs the full suite instead and earns the same status here, once it all passed.
  bot-fast-tier:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type == 'Bot' && !github.event.pull_request.head.repo.fork
    needs: [test, migrations, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=fast-tier -f description="full CI passed on a bot PR"
