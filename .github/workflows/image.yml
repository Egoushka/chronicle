name: image

# Publishes ghcr.io/egoushka/chronicle (api + worker) and chronicle-mcp on a
# version tag. Pull requests build the same images without pushing, so a broken
# Dockerfile fails here and not on the box.
on:
  pull_request:
    paths: [Dockerfile, Dockerfile.mcp, pyproject.toml, chronicle/**, migrations/**, .github/workflows/image.yml]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: chronicle, dockerfile: Dockerfile }
          - { name: chronicle-mcp, dockerfile: Dockerfile.mcp }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=ci; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64
          tags: ghcr.io/egoushka/${{ matrix.name }}:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Image size
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep chronicle
