## chronicle — personal event store and retrieval brain. Ingests Telegram,
## wakapi, dawarich (and more) into one timeline; serves it over MCP so an
## assistant can actually look things up about its owner's life.
## Sources: this file runs on its own. How the worker reaches your sources
##   (bind mounts, other stacks' networks) goes in compose.override.yaml,
##   which Compose merges automatically — start from
##   compose.sources.example.yaml.
## Reached via: 127.0.0.1:8030 (api) and :8031 (MCP) on the host, i.e. an SSH
##   tunnel, or another service on `chronicle_default`. Nothing here
##   authenticates and this is the most sensitive data on the host: never
##   publish these ports beyond loopback or join a shared proxy network.

services:
  chronicle-api:
    build: .
    container_name: chronicle-api
    restart: unless-stopped

    ports: ["127.0.0.1:8030:8030"]
    env_file: .env

    environment:
      CHRONICLE_DB_URL: postgresql://chronicle:${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}@chronicle-db:5432/chronicle
      # Embeddings run ON BOX. Every message in telegram-sync has already been
      # sent to OpenAI via text-embedding-3-small; this is the change that
      # stops that. BGE-M3 also scores better on Russian: ruMTEB retrieval
      # avg 74.79 vs mE5-large 74.04, MIRACL-ru 70.16 vs 67.33.
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: "1024"
      # The api encodes ONE query per request, so it runs BAAI's own fp32 ONNX
      # export of the same weights instead of FlagEmbedding/torch. Measured on
      # this box 2026-09-26 (docs/ADR-003), same process, same inputs:
      #
      #                  steady RSS   peak      query     top-20 vs torch
      #   torch fp16     3,979 MB     4,430 MB  0.246 s   —
      #   onnx fp32      1,723 MB     1,723 MB  0.052 s   40/40 identical
      #   onnx int8      1,147 MB     1,147 MB  0.023 s   0/40 identical, top-1 moved on 12.5%
      #
      # int8 was rejected: cos 0.985 to the stored vectors is enough to reorder
      # every result list, and with no labelled eval there is no way to show
      # that reordering is not a regression. The worker stays on torch (it
      # wrote every stored vector) — do not switch it without re-embedding.
      EMBED_BACKEND: onnx
      # torch defaults to one thread per core. On 16 cores that OVERSUBSCRIBES
      # a box already running ~107 other services, and the threads spend more
      # time contending than computing. Measured, one short query through
      # BGE-M3, mean of 5 after warmup:
      #
      #     threads   fp16      fp32
      #     16        0.541s    4.385s     <- the default, i.e. no setting
      #      8        0.215s    0.198s
      #      4        0.238s    0.250s
      #
      # 8 is the floor of that curve. Note fp32 at 16 threads is 8x WORSE than
      # fp16 at 16 — use_fp16=True is doing real work here despite there being
      # no GPU, because this model is memory-bandwidth bound on CPU, not
      # FLOP-bound. Do not "fix" it by turning fp16 off.
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      # Reserved for query-time reasoning — summaries and snippets, never the
      # raw archive. The api makes no LLM call today, so both are optional.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # /recall {"rerank": true}: a chat model reorders the top RERANK_POOL
      # (rerank.py). Unset RERANK_MODEL and the flag is ignored.
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_POOL: ${RERANK_POOL:-40}
      RERANK_RPM: ${RERANK_RPM:-120}

    volumes:
      # Model cache. Without this every restart re-downloads ~2.2 GB of BGE-M3.
      - chronicle_models:/models

    # 2g was not enough and the failure was invisible: /health passed, /stats
    # passed, and every /recall silently OOM-killed uvicorn mid-request. The
    # client saw a dropped connection, the container restarted, reloaded
    # BGE-M3, and looked healthy again — so the healthcheck never went red and
    # autoheal never fired.
    #
    # Measured: `Memory cgroup out of memory: Killed process (uvicorn)
    # anon-rss:2067848kB`, i.e. exactly at the 2g cap, CONSTRAINT_MEMCG. The
    # model LOADS in well under 2g; it is the first encode() that allocates.
    # chronicle-worker peaked at 3.885 GiB doing the same encode with an 8g
    # cap, so 5g was that plus headroom.
    #
    # That was torch. With EMBED_BACKEND=onnx the encoder peaks at 1,723 MB on
    # 1024-token inputs (the max_length truncation caps it; a query is far
    # shorter), plus pymorphy3 and the pool. 2560m is that peak plus ~50%.
    # Re-measure before lowering it: the failure mode above is silent.
    #
    # memswap_limit == mem_limit deliberately, per the estate convention: a
    # cgroup at its cap is OOM-killed rather than swapped, on a box that has
    # already hit 96% swap.
    mem_limit: 2560m
    memswap_limit: 2560m
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The model loads lazily on the first query, not on boot, so this no
      # longer has to cover a model load; kept generous anyway.
      start_period: 180s
    labels:
      - autoheal=true

    depends_on:
      chronicle-db:
        condition: service_healthy
    networks: [default]  # nothing here authenticates: never a shared network

  chronicle-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: chronicle-mcp
    restart: unless-stopped

    ports: ["127.0.0.1:8031:8031"]
    env_file: .env
    environment:
      CHRONICLE_API_URL: http://chronicle-api:8030

    mem_limit: 256m
    memswap_limit: 256m
    security_opt: [no-new-privileges:true]

    # Probes /sse, NOT /health. The MCP SDK's SSE transport serves /sse and
    # /messages/ and nothing else — /health 404s, so the old check reported a
    # perfectly healthy server as unhealthy, and with autoheal=true that is an
    # infinite restart loop on a service that was working.
    #
    # /sse is a stream, so curl never gets a clean exit: -m 3 always ends in
    # exit 28. The status LINE is what matters, so compare %{http_code}
    # instead of relying on curl's exit code.
    healthcheck:
      test: ["CMD-SHELL",
             "test \"$$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:8031/sse)\" = 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true

    depends_on: [chronicle-api]
    networks: [default]  # nothing here authenticates: never a shared network

  # ---------------------------------------------------------------------------
  # Batch enrichment. `restart: "no"` is load-bearing, not laziness.
  #
  # The reference host is 32 GB with 61.4 GB of mem_limit committed across 107
  # services and has already hit 96% swap. memswap_limit == mem_limit
  # everywhere, so a cgroup at its cap is OOM-killed rather than swapped.
  # There is no room for a resident 7B model.
  #
  # So: something starts it on a schedule — host cron running
  # scripts/nightly.sh, for example — it processes a bounded batch,
  # checkpoints, and exits. An OOM kill costs one batch, not the run.
  # ---------------------------------------------------------------------------
  chronicle-worker:
    build: .
    container_name: chronicle-worker
    restart: "no"
    command: ["python", "-m", "chronicle.worker"]

    env_file: .env
    environment:
      CHRONICLE_DB_URL: postgresql://chronicle:${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}@chronicle-db:5432/chronicle
      BATCH_SIZE: ${BATCH_SIZE:-500}
      # Enrichment is a CLOUD model through LiteLLM (decided 2026-09-26). The
      # "local 8B model" this used to name never existed: LiteLLM routes only
      # to hosted providers, and a box that retired whisperx for 3.6 GiB has
      # no room for a 5 GB model either. See chronicle/enrich.py.
      ENRICH_MODEL: ${ENRICH_MODEL:-gemini-3.5-flash-lite}
      ENRICH_URL: ${ENRICH_URL:-http://litellm:4000/v1}
      # 0 = off, pending measurement. The first batch (2,446 newest segments,
      # 2026-09-26) moved the eval from 55.0% to 52.3% — about one lookup of
      # 28, not conclusive, and not positive. Set ENRICH_LIMIT in .env to turn
      # it back on for an A/B run against `make eval-homelab`.
      ENRICH_LIMIT: ${ENRICH_LIMIT:-0}
      # Calls a minute to LiteLLM. Unbounded, the 2026-09-29 run made ~895 a
      # minute, took its $10 key to $17.54 and the box's $50 budget to 96%.
      ENRICH_RPM: ${ENRICH_RPM:-120}
      # Pre-extraction gate (chronicle/gate.py): none | jev | chat. Off by
      # default. GATE_KEY, a dedicated LiteLLM virtual key, goes in .env.
      # GATE_SKIP=0 scores and still extracts (shadow); 1 skips low scores.
      GATE_BACKEND: ${GATE_BACKEND:-none}
      GATE_URL: ${GATE_URL:-}
      GATE_MODEL: ${GATE_MODEL:-}
      GATE_THRESHOLD: ${GATE_THRESHOLD:-0.42}
      GATE_SKIP: ${GATE_SKIP:-0}
      GATE_RPM: ${GATE_RPM:-300}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      # Same reasoning as chronicle-api above. The worker encodes in batches
      # rather than one query at a time, so it is less sensitive than the API,
      # but it runs on the same contended 16 cores.
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"

    # Sources are mounted and networked in compose.override.yaml; see
    # compose.sources.example.yaml.
    volumes:
      - chronicle_models:/models

    mem_limit: 8g
    memswap_limit: 8g
    security_opt: [no-new-privileges:true]

    depends_on:
      chronicle-db:
        condition: service_healthy
    networks: [default]
    profiles: [batch]

  # Stack-private. Never attach it to a shared network: a service there whose
  # name collides with another stack's hijacks DNS for every container on it.
  chronicle-db:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: chronicle-db
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}
      POSTGRES_USER: chronicle
      POSTGRES_DB: chronicle
      # ~123 MB of halfvec(1024) for 60k segments wants to live in RAM.
      # Exact scan over that is single-digit ms and every date filter stays
      # exact — no HNSW, so no percolation failure on 1%-cardinality filters.
      POSTGRES_INITDB_ARGS: "--data-checksums"

    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB

    volumes:
      # From PostgreSQL 18 the image keeps its data in /var/lib/postgresql/18/docker,
      # so the volume goes on /var/lib/postgresql, not .../data.
      - chronicle_pg18:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro

    mem_limit: 2g
    memswap_limit: 2g
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks: [default]

networks:
  default:
    ipam:
      config:
        # Pinned so firewall rules can name it. Change it if it collides with
        # a network on your host.
        - subnet: 10.211.71.0/24

volumes:
  # PostgreSQL 16's data from before the move to 18. Nothing mounts it; it is kept
  # so going back is reverting that change. Delete it once 18 has run clean.
  chronicle_pg:
  chronicle_pg18:
  chronicle_models:
