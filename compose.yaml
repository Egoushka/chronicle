## chronicle — personal event store and retrieval brain. Ingests Telegram,
## wakapi, dawarich (and more) into one timeline; serves it to agent-runner
## over MCP so the assistant can actually look things up about Yehor's life.
## Deploy: /srv/stacks/chronicle
## Reached via: tailnet only — chronicle-api on 127.0.0.1:8030, MCP on :8031.
##   No Caddy vhost: this is the most sensitive data on the box, agent-runner
##   reaches it over `edge`, and nothing else needs to.
## Depends on: telegram-sync (read-only), optionally wakapi + dawarich

services:
  chronicle-api:
    build: .
    container_name: chronicle-api
    restart: unless-stopped

    ports: ["127.0.0.1:8030:8030"]
    env_file: .env

    environment:
      CHRONICLE_DB_URL: postgresql://chronicle:${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}@chronicle-db:5432/chronicle
      # Embeddings run ON BOX. Every message in telegram-sync has already been
      # sent to OpenAI via text-embedding-3-small; this is the change that
      # stops that. BGE-M3 also scores better on Russian: ruMTEB retrieval
      # avg 74.79 vs mE5-large 74.04, MIRACL-ru 70.16 vs 67.33.
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: "1024"
      # Query-time reasoning still goes through LiteLLM — that traffic is
      # summaries and snippets, not the raw archive, and it is a few hundred
      # calls a month.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY in chronicle/.env}

    volumes:
      # Model cache. Without this every restart re-downloads ~2.2 GB of BGE-M3.
      - chronicle_models:/models

    mem_limit: 2g
    memswap_limit: 2g
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # BGE-M3 loads from the volume on boot; cold start is genuinely slow.
      start_period: 180s
    labels:
      - autoheal=true

    depends_on:
      chronicle-db:
        condition: service_healthy
    networks: [default, edge]

  chronicle-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: chronicle-mcp
    restart: unless-stopped

    ports: ["127.0.0.1:8031:8031"]
    env_file: .env
    environment:
      CHRONICLE_API_URL: http://chronicle-api:8030

    mem_limit: 256m
    memswap_limit: 256m
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8031/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true

    depends_on: [chronicle-api]
    networks: [default, edge]

  # ---------------------------------------------------------------------------
  # Batch enrichment. `restart: "no"` is load-bearing, not laziness.
  #
  # The box is 32 GB with 61.4 GB of mem_limit committed across 107 services
  # and has already hit 96% swap. memswap_limit == mem_limit everywhere, so a
  # cgroup at its cap is OOM-killed rather than swapped. There is no room for
  # a resident 7B model.
  #
  # So: n8n (or a systemd timer) starts this, it processes a bounded batch,
  # checkpoints, and exits. An OOM kill costs one batch, not the run.
  #   docker compose -f /srv/stacks/chronicle/compose.yaml run --rm chronicle-worker
  # ---------------------------------------------------------------------------
  chronicle-worker:
    build: .
    container_name: chronicle-worker
    restart: "no"
    command: ["python", "-m", "chronicle.worker"]

    env_file: .env
    environment:
      CHRONICLE_DB_URL: postgresql://chronicle:${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}@chronicle-db:5432/chronicle
      BATCH_SIZE: ${BATCH_SIZE:-500}
      # Local model for enrichment. Runs only while this container runs.
      ENRICH_MODEL: ${ENRICH_MODEL:-qwen3:8b-q4_K_M}
      OLLAMA_URL: ${OLLAMA_URL:-http://litellm:4000/v1}

    volumes:
      - chronicle_models:/models
      # telegram-sync is SQLite, not Postgres — /data/telegram.db in that
      # stack, 682,099 rows. The adapter opens it with a `mode=ro` URI, so
      # SQLite itself refuses every write; the mount is deliberately NOT `:ro`
      # because the file is in WAL mode and WAL needs to create a -shm file
      # for locking even on a read-only connection. With `:ro` the open fails
      # outright: "unable to open database file".
      - /srv/stacks/telegram-sync/data:/srv/telegram
      # wakapi is SQLite too, on its own stack's volume. journal_mode=delete
      # there, so `:ro` is fine.
      - wakapi_data:/srv/wakapi:ro

    mem_limit: 8g
    memswap_limit: 8g
    security_opt: [no-new-privileges:true]

    depends_on:
      chronicle-db:
        condition: service_healthy
    # No `edge`: the worker talks to the DB and to LiteLLM's private address.
    # It has no reason to be reachable from the tailnet. `dawarich_net` is
    # read-only access to dawarich_db, which is not published to the host.
    networks: [default, dawarich_net]
    profiles: [batch]

  # Stack-private. NEVER joins `edge` — a service reachable there hijacks DNS
  # for every container on the network, which is what killed langfuse in 1.3.0.
  chronicle-db:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    container_name: chronicle-db
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in chronicle/.env}
      POSTGRES_USER: chronicle
      POSTGRES_DB: chronicle
      # ~123 MB of halfvec(1024) for 60k episodes wants to live in RAM.
      # Exact scan over that is single-digit ms and every date filter stays
      # exact — no HNSW, so no percolation failure on 1%-cardinality filters.
      POSTGRES_INITDB_ARGS: "--data-checksums"

    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB

    volumes:
      - chronicle_pg:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

    mem_limit: 2g
    memswap_limit: 2g
    security_opt: [no-new-privileges:true]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks: [default]

networks:
  default:
    ipam:
      config:
        # Registered in NETWORKS.md. 10.211.70.0/24 is telegram-sync.
        - subnet: 10.211.71.0/24
  edge:
    external: true
    name: headscale_headscale_net
  # dawarich_db is stack-private (10.211.22.0/24) and publishes no host port,
  # so the worker joins dawarich's network to read it. Same pattern librechat
  # uses for litellm/agent-runner/metamcp.
  dawarich_net:
    external: true
    name: dawarich_default

volumes:
  chronicle_pg:
  chronicle_models:
  # Owned by the wakapi stack; chronicle only reads it.
  wakapi_data:
    external: true
    name: wakapi_wakapi_data

# Checklist before committing (from _template/compose.yaml):
#   [x] service names stack-prefixed — chronicle-api/-mcp/-worker/-db
#   [ ] subnet 10.211.71.0/24 registered in NETWORKS.md  <- NOT DONE. Verified
#       free 2026-07-30 (nothing in homelab-gitops references .71; the highest
#       allocation is .70, telegram-sync) — but the row still has to be added.
#   [x] chronicle-db digest resolved 2026-07-30 against the live daemon:
#         pgvector/pgvector:pg16 -> sha256:a362508…14c6b, pgvector 0.8.6
#       halfvec needs >= 0.7, so this image is fine. Still needs a PINS.md row
#       in the homelab repo or check-pins.sh fails.
#   [x] secrets via ${VAR:?}; .env.enc only, never inline
#   [x] DB stays off `edge`
#   [ ] `make validate` passes in the homelab repo after cloning this in
